services:
    ner-service:
      build:
        context: .
        dockerfile: Dockerfile.ner
      ports:
        - "8001:8001"

    rag-service:
      build:
        context: .
        dockerfile: Dockerfile.rag
      ports:
        - "8002:8002"
      env_file:
        - .env

    agent:
      build:
        context: .
        dockerfile: Dockerfile
      env_file:
        - .env
      environment:
        - NER_SERVICE_URL=http://ner-service:8001
        - RAG_SERVICE_URL=http://rag-service:8002
      depends_on:
        - ner-service
        - rag-service
      stdin_open: true
      tty: true